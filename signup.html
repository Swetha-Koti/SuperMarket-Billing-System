<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SuperMarket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">
        <i class="fas fa-shopping-basket"></i> SuperMarket
    </div>

    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="home.html#products">Products</a></li>
            <li><a href="home.html#offers">Offers</a></li>
            <li><a href="home.html#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="login-section">
    <div class="login-container">

        <h2>Create Account</h2>
        <p>Sign up to start shopping.</p>

        <form id="signup-form">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="checkout-btn">
                Sign Up
            </button>

        </form>

        <p style="text-align:center;margin-top:15px;">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>
</section>

<footer>
    <p>&copy; 2026 SuperMarket. All Rights Reserved.</p>
</footer>

<script>
document.getElementById("signup-form").addEventListener("submit", function(e){

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(name==="" || email==="" || phone==="" || password==="" || confirmPassword===""){
        alert("Please fill all fields.");
        return;
    }

    if(password !== confirmPassword){
        alert("Passwords do not match.");
        return;
    }

    // Save user details
    localStorage.setItem("userName", name);
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPhone", phone);
    localStorage.setItem("userPassword", password);

    alert("Registration Successful!");

    window.location.href = "login.html";

});
</script>

</body>
</html>
